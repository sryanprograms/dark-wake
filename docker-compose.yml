services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: darkwake
      POSTGRES_PASSWORD: darkwake
      POSTGRES_DB: darkwake
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkwake -d darkwake"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://darkwake:darkwake@postgis:5432/darkwake
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    command: >
      sh -c "python -m app.db.migrate &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgis_data:
